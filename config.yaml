profile:
  resume_path: /home/shrey/Shrey/Shrey_Marwaha_Senior_DE_2026.pdf
  profile_path: /home/shrey/job_agent/profile.json

search:
  keywords:
    - Senior Data Engineer
    - Lead Data Engineer
    - Azure Data Engineer
    - Staff Data Engineer
  profiles:
    - location: "Bengaluru, Karnataka, India"
      work_modes: [hybrid, onsite]
    - location: "Worldwide"
      geo_id: "92000000"       # LinkedIn's special geo ID for worldwide remote
      work_modes: [remote]
  salary_floor_lpa: 35
  max_jobs_per_run: 30

sources:
  linkedin:
    enabled: true
    profile_dir: /home/shrey/job_agent/browser_profiles/linkedin
    easy_apply_only: false
  indeed:
    enabled: false
    cookies_file: /home/shrey/job_agent/cookies/indeed.json
  naukri:
    enabled: false
    cookies_file: /home/shrey/job_agent/cookies/naukri.json

ranker:
  model: grok-3-mini    # fast + cheap, xAI free tier
  min_score: 7          # 1-10, jobs below this are auto-rejected
  top_n: 20             # show top N in review UI

cover_letter:
  model: grok-3-mini
  max_words: 250

db:
  path: /home/shrey/job_agent/db/jobs.db

browser:
  headless: false
  slow_mo: 500          # ms between actions, avoids bot detection
  executable_path: /snap/bin/chromium
